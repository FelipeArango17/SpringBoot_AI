spring.application.name=reservation

# Carga las credenciales desde backend/.env (líneas CLAVE=VALOR). Es opcional: también funcionan variables de entorno reales.
spring.config.import=optional:file:.env[.properties]

# Conexión a PostgreSQL (los valores vienen del .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate: actualiza el esquema automáticamente y muestra el SQL en consola
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
