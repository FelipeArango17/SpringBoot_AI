spring.application.name=banktransfer

# Credenciales desde backend/.env (opcional); también sirven variables de entorno reales.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (base 'banktdea'); los valores por defecto aplican si no hay .env
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banktdea}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate: esquema automático y SQL en consola
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Propiedades propias
app.cors.allowed-origin=http://localhost:3000
app.seed-data=true
